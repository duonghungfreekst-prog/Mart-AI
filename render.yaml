services:
  - type: web
    name: Mart-AI
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore
    # Paid compute stays running; Render Free instances sleep after inactivity.
    plan: 0.5c-512mb
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 30
    autoDeployTrigger: commit
    envVars:
      - key: RENDER
        value: "true"
      - key: CHROME_BIN
        value: "/usr/bin/chromium-browser"
      - key: CHROMIUM_PATH
        value: "/usr/bin/chromium-browser"
      - key: GOMEMLIMIT
        value: "220MiB"
      - key: GOGC
        value: "40"
      # Set this secret in the Render dashboard. Render filesystems are ephemeral,
      # so database connection settings must survive restarts as environment vars.
      - key: DATABASE_URL
        sync: false
      - key: MART_ADMIN_PASSWORD
        sync: false
