<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Mart AI — Đồng bộ tài khoản Muse</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; width: 345px; margin: 0; padding: 14px; color: #1f2937; }
    h1 { font-size: 15px; margin: 0 0 6px; }
    .sub { font-size: 12px; color: #4b5563; margin-bottom: 10px; line-height: 1.4; }
    label { display: block; font-size: 12px; font-weight: 600; margin: 10px 0 4px; }
    input[type=text], input[type=password] { width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 13px; }
    .row { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 12px; }
    button { width: 100%; margin-top: 12px; padding: 9px; border: 0; border-radius: 8px; background: #111827; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    #status { margin-top: 10px; font-size: 12px; min-height: 16px; line-height: 1.4; }
    #status.ok { color: #15803d; }
    #status.err { color: #b91c1c; }
    .hint { font-size: 11px; color: #6b7280; margin-top: 8px; line-height: 1.4; }
  </style>
</head>
<body>
  <h1>Mart AI — Bắt Tài Khoản Muse</h1>
  <div class="sub">Mẹo nhanh: Trên trang <b>/admin</b> của Mart AI, bạn chỉ cần bấm nút <b>Đăng nhập &amp; Tự động bắt</b> là tiện ích sẽ tự làm hết mà không cần nhập gì ở đây!</div>

  <label for="server">Địa chỉ Mart AI (khi gửi trực tiếp từ tiện ích)</label>
  <input type="text" id="server" placeholder="https://mart-ai.onrender.com" autocomplete="off">

  <label for="password">Mật khẩu Admin (MART_ADMIN_PASSWORD)</label>
  <input type="password" id="password" placeholder="Nhập mật khẩu admin đã đặt trên Render" autocomplete="off">

  <label for="label">Tên hiển thị (tùy chọn)</label>
  <input type="text" id="label" placeholder="Để trống tự đánh số Muse #1, #2…" autocomplete="off">

  <div class="row">
    <input type="checkbox" id="auto">
    <label for="auto" style="margin:0;font-weight:400">Tự động đẩy lên server mỗi khi đăng nhập muse.ai</label>
  </div>

  <button id="send">⚡ Gửi tài khoản muse.ai đang đăng nhập</button>
  <div id="status" role="status"></div>
  <div class="hint">Tiện ích đọc trực tiếp cookie <code>hatch_sess</code> (HttpOnly) của <code>muse.ai</code> và mã hóa vào Pool Token.</div>

  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
